name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      # Only Postgres is needed: migrations, pg_cron, and pgTAP.
      - name: Start local database
        run: >
          supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Lint SQL functions
        run: supabase db lint --local --schema app,public --level warning --fail-on error

      - name: pgTAP tests
        run: supabase test db --local

      - name: Security and performance advisors
        run: supabase db advisors --local --type all --level warn --fail-on error

  # Applies new migrations to the live project after tests pass on main.
  # Needs the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD secrets and the
  # SUPABASE_PROJECT_REF variable; skipped until they exist.
  deploy-database:
    name: Deploy database
    needs: database
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-database
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "Supabase secrets or project ref not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ready == 'true'
        with:
          version: 2.119.0

      - name: Push migrations
        if: steps.config.outputs.ready == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

  ios:
    name: Swift tests and screenshots
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: LineMapCore unit tests
        run: swift test --package-path Packages/LineMapCore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          # Newest iOS runtime; prefer a "Pro" iPhone, else any iPhone.
          UDID=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | test("SimRuntime\\.iOS-")))
            | sort_by(.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)") | [(.maj | tonumber), (.min | tonumber)])
            | last | .value
            | map(select(.name | startswith("iPhone")))
            | (map(select(.name | test(" Pro$"))) + .)
            | first | "\(.udid)"')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No iPhone simulator found. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"
          xcrun simctl list devices | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build app and run screenshot UI test
        run: |
          xcodebuild test -quiet \
            -project LineMap.xcodeproj \
            -scheme LineMap \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/UITests.xcresult

      - name: Export screenshots
        if: always()
        run: |
          [ -d build/UITests.xcresult ] || exit 0
          mkdir -p build/screenshots
          xcrun xcresulttool export attachments \
            --path build/UITests.xcresult \
            --output-path build/screenshots
          # Rename exported files to their readable attachment names (e.g. 01-Home_...png).
          cd build/screenshots
          jq -r '.[].attachments[] | [.exportedFileName, .suggestedHumanReadableName] | @tsv' manifest.json |
            while IFS=$'\t' read -r from to; do mv "$from" "$to"; done
          ls -la

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: warn
